- id: RFC919
  title: "Broadcasting Internet Datagrams"
  url: https://www.rfc-editor.org/info/rfc919/
  publisher: RFC Editor / IETF
  version: "RFC 919, October 1984; STD 5"
  accessed_at: "2026-10-26"
  sections: "1 Introduction; 2 Terminology; 4 Broadcast Classes; 5 Broadcast Methods; 6 Gateways and Broadcasts; 7 Broadcast IP Addressing - Proposed Standards"
  document_status: "Internet Standard (STD 5); archival historical RFC; RFC Editor metadata page lists no Updates/Obsoletes relationship"
  updates: []
  obsoleted_by: []
  access_status: "full_text_accessible_via_RFC_Editor"
  notes: "RFC 919 itself says its discussion does not cover subnet/broadcast complications (section 1); use RFC 922 and later host/router requirements for the relevant details. Historical terminology and proposed rules are not treated as a current standalone L2 bridging standard."
- id: RFC922
  title: "Broadcasting Internet datagrams in the presence of subnets"
  url: https://www.rfc-editor.org/info/rfc922/
  publisher: RFC Editor / IETF
  version: "RFC 922, October 1984; STD 5"
  accessed_at: "2026-10-26"
  sections: "2 Terminology; 4 Broadcast Classes; 5 Broadcast Methods; 6 Gateways and Broadcasts; 7 Broadcast IP Addressing - Conventions"
  document_status: "Internet Standard (STD 5); archival historical RFC; RFC Editor metadata page lists no Updates/Obsoletes relationship"
  updates: []
  obsoleted_by: []
  access_status: "full_text_accessible_via_RFC_Editor"
  notes: "Section 2 distinguishes a local hardware network from logical IP networks/subnets. Section 7 gives the limited-broadcast non-forwarding convention and examples; later requirements in RFC 1122 and RFC 2644 are used for applicable current host/router behavior."
- id: RFC1122
  title: "Requirements for Internet Hosts - Communication Layers"
  url: https://www.rfc-editor.org/info/rfc1122/
  publisher: RFC Editor / IETF
  version: "RFC 1122, October 1989; STD 3"
