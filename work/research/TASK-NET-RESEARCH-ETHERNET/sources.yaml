  publisher: IEEE Standards Association Registration Authority
  version: Current web page; version/date not stated
  accessed_at: 2026-10-26
  sections: EtherType description
  document_status: Current public registry information
  updates: null
  obsoleted_by: null
  access_status: Accessible
  notes: >-
    IEEE RA describes EtherType as protocol identification/context for interpreting
    the data field and points to IEEE 802.3 clauses 3, 3.1.1, and 3.2.6. It does not
    itself establish the complete frame layout or bridge forwarding rules.
