- id: IEEE8021Q_2022
  title: IEEE Standard for Local and Metropolitan Area Networks—Bridges and Bridged Networks
  url: https://standards.ieee.org/ieee/802.1Q/10323/
  publisher: IEEE Standards Association
  version: IEEE Std 802.1Q-2022
  accessed_at: 2026-10-26
  sections: null
  document_status: Active Standard; published 2022-12-22; supersedes IEEE 802.1Q-2018
  updates: null
  obsoleted_by: null
  access_status: Metadata and abstract accessible; normative standard text not retrieved
  notes: >-
    The official page states this standard specifies MAC service over bridged networks
    and operation of MAC bridges and VLAN bridges, including algorithms. It lists active
    amendments through 802.1Qdy-2025. GET document endpoint inaccessible via web gateway;
    source learning, forwarding, filtering, and flooding clauses therefore remain unchecked.
- id: IEEE_RA_ETHERTYPE
