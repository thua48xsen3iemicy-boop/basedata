- id: RFC1042
  title: Standard for the Transmission of IP Datagrams over IEEE 802 Networks
  url: https://www.rfc-editor.org/info/rfc1042
  publisher: RFC Editor / IETF RFC Series
  version: RFC 1042, STD 43; 1988-02; Internet Standard
  accessed_at: 2026-10-26
  sections: Introduction; Header Format; Frame Format and MAC Level Issues; For IEEE 802.3
  document_status: Internet Standard (STD 43)
  updates: []
  obsoleted_by: []
  access_status: Accessible
  notes: >-
    RFC Editor metadata shows RFC 1042 obsoletes RFC 948. No Updates or later
    Obsoleted by relationship was displayed. RFC Editor errata page has two entries
    held for document update, including technical erratum 1329, relevant to an ARP
    minimum-packet-size sentence; this research does not rely on that sentence.
    The RFC describes IP/ARP encapsulation on multiple historical IEEE 802 LANs,
    not current Ethernet bridge relay behavior.
