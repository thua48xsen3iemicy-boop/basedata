  accessed_at: 2026-10-26
  sections: null
  document_status: Active Standard; published 2022-07-29; supersedes IEEE 802.3-2018
  updates: null
  obsoleted_by: null
  access_status: Metadata and abstract accessible; normative standard text not retrieved
  notes: >-
    Official page says IEEE GET program provides downloads, but its endpoint returned
    HTTP 418 through the browser tool and a direct download request was blocked by the
    network proxy. The abstract says IEEE 802.3 specifies the common MAC and CSMA/CD
