sources:
  - id: RFC826
    title: "An Ethernet Address Resolution Protocol: Or Converting Network Protocol Addresses to 48.bit Ethernet Address for Transmission on Ethernet Hardware"
    url: https://www.rfc-editor.org/info/rfc826
    publisher: RFC Editor / Internet Engineering Task Force
    version: RFC 826, November 1982; STD 37
    accessed_at: 2026-10-26
    sections: ["Packet format", "Packet Generation", "Packet Reception"]
    document_status: Internet Standard (RFC Editor metadata)
    updates: [RFC 5227, RFC 5494]
    obsoleted_by: null
    access_status: verified
    notes: "RFC Editor metadata and full text page read through web search connector. The RFC Editor page lists updates; it does not list an Obsoletes/Obsoleted-by relation. Packet Generation describes routing-selected immediate target protocol address; IPv4 host routing context is corroborated by RFC 1122 §3.3.1."
  - id: RFC1122
    title: "Requirements for Internet Hosts - Communication Layers"
    url: https://www.rfc-editor.org/info/rfc1122
    publisher: RFC Editor / Internet Engineering Task Force
    version: RFC 1122, October 1989; STD 3
    accessed_at: 2026-10-26
    sections: ["§2.3.2.1 ARP Cache Validation", "§2.4 Link/Internet Layer Interface", "§3.3.1 Routing Outbound Datagrams", "§3.3.1.1 Local/Remote Decision"]
    document_status: Internet Standard (RFC Editor metadata)
    updates: [RFC 1349, RFC 4379, RFC 5884, RFC 6093, RFC 6298, RFC 6633, RFC 6864, RFC 8029, RFC 9293]
    obsoleted_by: null
    access_status: verified
    notes: "RFC Editor metadata and relevant full text sections read. Metadata lists the updates above and no Obsoletes/Obsoleted-by relation. Proxy ARP is mentioned in §2.3.2.1 and referenced to §2.4 of RFC 1122 Introduction; detailed proxy behavior is outside scope."
  - id: RFC5227
    title: "IPv4 Address Conflict Detection"
    url: https://www.rfc-editor.org/info/rfc5227
    publisher: RFC Editor / Internet Engineering Task Force
    version: RFC 5227, July 2008; Standards Track, Proposed Standard
    accessed_at: 2026-10-26
    sections: ["§1.1 Conventions and Terminology Used in This Document", "§1.2 Relationship to RFC 826", "§1.3 Applicability", "§2.1 Probing an Address", "§2.1.1 Probe Details", "§2.3 Announcing an Address", "§2.4 Ongoing Address Conflict Detection and Address Defense", "§5 Security Considerations"]
    document_status: Proposed Standard (RFC Editor metadata; Standards Track)
    updates: [RFC 826]
    obsoleted_by: null
    access_status: verified
    notes: "RFC Editor metadata read. RFC 5227 HTML text was retrieved from the RFC Editor search result; direct open was rate-limited. Metadata lists Updates: RFC 826 and no Obsoletes/Obsoleted-by relation. Applicability limits are in §1.3."
