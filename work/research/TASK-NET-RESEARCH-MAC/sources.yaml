- id: IEEE-RA-FAQ
  title: IEEE Registration Authority FAQs
  url: https://standards.ieee.org/faqs/regauth/
  publisher: IEEE Standards Association Registration Authority
  version: Current web page; no publication/version date stated
  accessed_at: 2026-10-26
  sections:
    - "OUI, EUI-48, EUI-64, MAC ADDRESSES, CID"
    - "What are an EUI-48 and an EUI-64?"
    - "How can I obtain a universally unique MAC/Ethernet address?"
  document_status: Official IEEE RA informational FAQ
  updates: null
  obsoleted_by: null
  access_status: full_text_accessed
  notes: >-
    IEEE says EUI-48/EUI-64 are globally unique identifiers and that universally unique
    MAC/Ethernet blocks are assigned by IEEE RA; do not infer that every 48-bit address
    is universally unique. FAQ also says individual single address assignments are not
    available from IEEE. Web page has no displayed publication/version date.

- id: RFC826
  title: An Ethernet Address Resolution Protocol
  url: https://www.rfc-editor.org/rfc/rfc826.html
  publisher: IETF / RFC Editor
  version: RFC 826, November 1982
  accessed_at: 2026-10-26
  sections:
    - Abstract
    - "Packet format"
    - "Packet Generation"
  document_status: Internet Standard (STD 37), RFC Editor metadata checked
  updates: []
  updated_by: [RFC 5227, RFC 5494]
  obsoleted_by: null
  access_status: full_text_accessed
  notes: >-
    Used only for the conceptual boundary: protocol routing determines the next-hop
    protocol address, and address resolution maps the protocol/address pair to a 48-bit
    Ethernet address for transmission. This is the Ethernet/ARP example in RFC 826,
    not a claim that every link layer uses ARP.

- id: RFC894
  title: A Standard for the Transmission of IP Datagrams over Ethernet Networks
  url: https://www.rfc-editor.org/info/rfc894/
  publisher: IETF / RFC Editor
  version: RFC 894, April 1984
  accessed_at: 2026-10-26
  sections:
    - "Address Mappings"
    - "Broadcast Address"
  document_status: Internet Standard (STD 41), RFC Editor metadata and full text accessed
  updates: null
  obsoleted_by: null
  access_status: full_text_accessed
  notes: >-
    Section Broadcast Address specifies the all-ones Ethernet destination as
    FF-FF-FF-FF-FF-FF. The document scopes itself to IP datagrams over the original
    10 Mb/s Ethernet with 48-bit addresses; keep that protocol/example context clear.

