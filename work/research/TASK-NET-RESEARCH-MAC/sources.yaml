- id: IEEE-MAC-TUTORIAL
  title: "Standard Group MAC Addresses: A Tutorial Guide"
  url: https://standards.ieee.org/wp-content/uploads/import/documents/tutorials/macgrp.pdf
  publisher: IEEE Registration Authority / IEEE Standards Association
  version: Edition/date not stated in the accessed PDF; version unknown
  accessed_at: 2026-10-26
  sections:
    - "Binary and Hexadecimal Representation of LAN MAC Addresses"
    - "Figure 1 - Representation of LAN MAC Addresses"
  document_status: Official IEEE Registration Authority tutorial; not an IEEE standard
  updates: null
  obsoleted_by: null
  access_status: full_text_accessed
  notes: >-
    Official tutorial PDF text was opened. It states that the 48-bit form is six octets,
    shown left-to-right in transmission order; bits within an octet are transmitted
    least-significant bit first; the Individual/Group bit is the least-significant bit
    and the U/L bit is the next. Because no edition date is printed in the accessed PDF,
    do not attribute a guessed edition. Use it as explanatory IEEE RA material, not a
    substitute for IEEE Std 802 or 802.3.

