- id: RFC9542
  title: IANA Considerations and IETF Protocol and Documentation Usage for IEEE 802 Parameters
  url: https://www.rfc-editor.org/rfc/rfc9542.html
  publisher: IETF / RFC Editor
  version: RFC 9542, BCP 141, April 2024
  accessed_at: 2026-10-26
  sections:
    - "1.1 Notations Used in This Document"
    - "2.1 48-Bit MAC Identifiers, OUIs, and Other Prefixes; Table 1; Figure 1"
    - "2.1.1 Special First Octet Bits; Table 2"
    - "2.1.2 OUIs and CIDs"
    - "6 Security Considerations"
  document_status: Best Current Practice; RFC Editor states it obsoletes RFC 7042
  updates: null
  obsoleted_by: null
  access_status: full_text_accessed
  notes: >-
    RFC Editor metadata and the document's own header were checked. The document is BCP
    141 and the current successor to RFC 7042; its IEEE policy descriptions are expressly
    informative, and IEEE sources prevail for IEEE policy/standards (Section 2, paragraph 1).
    Section 1.1 says the RFC displays octets in IETF/network bit ordering while bits on an
    IEEE 802.3 link are transmitted lowest-order to highest-order within each octet.

