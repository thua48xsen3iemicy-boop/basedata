claims_with_evidence:
  - claim: "IPv4 is a 32-bit value (four octets); strict dotted-decimal IPv4 URI literal syntax uses four decimal octets, each 0 through 255."
    source_ids: [RFC791, RFC3986]
  - claim: "CIDR prefix length is a decimal number from 0 through 32 denoting significant leading bits, whose mask uses leading ones followed by zeroes."
    source_ids: [RFC4632]
  - claim: "On an IPv4 point-to-point /31 link, both endpoint addresses are host addresses; limited broadcast is used for broadcast traffic."
    source_ids: [RFC3021]
  - claim: "RFC1918 private-use blocks are 10/8, 172.16/12, and 192.168/16; special-purpose/reachability properties are broader and distinct."
    source_ids: [RFC1918, IANA-IPV4-SPECIAL]
