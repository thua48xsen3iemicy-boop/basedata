claims_with_evidence:
  - claim: "The common Ethernet MAC identifier form is 48 bits in six octets, with octet display order distinct from within-octet IEEE transmission bit order."
    source_ids:
      - RFC9542
      - IEEE-MAC-TUTORIAL
  - claim: "The M/I-G bit distinguishes individual from groupcast, and groupcast includes multicast and broadcast; the next X/U-L bit indicates global versus local scope."
    source_ids:
      - RFC9542
      - IEEE-MAC-TUTORIAL
  - claim: "48-bit length alone does not guarantee global uniqueness; IEEE globally unique EUI-48 identifiers are assigned in blocks, and configured/spoofed values can change."
    source_ids:
      - RFC9542
      - IEEE-RA-FAQ
      - IEEE-RA-MAC
  - claim: "For Ethernet transmission, routing identifies a next-hop protocol address before address resolution maps that address to a 48-bit Ethernet address."
    source_ids:
      - RFC826
  - claim: "The all-ones Ethernet broadcast value is FF-FF-FF-FF-FF-FF in the RFC 894 10 Mb/s Ethernet/IP context."
    source_ids:
      - RFC894
      - RFC9542
