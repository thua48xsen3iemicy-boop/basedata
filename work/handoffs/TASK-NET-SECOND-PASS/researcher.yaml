claims_with_evidence:
  - claim: "A scoped Cisco switch example learns the source and forwards, filters, or floods based on destination and VLAN. Onlink is an explicit direct adjacency assertion in iproute2. All are draft. Open questions include current IEEE and full Linux recursion semantics."
    source_ids: [CISCO_SWITCH, CISCO_LEARN, IPROUTE2_MAN]
  - claim: "RFC 894 specifies the all-ones Ethernet broadcast address for its 10Mbps Ethernet IP context."
    source_ids: [RFC894]
  - claim: "RFC 1122 section 2.3.3 specifies RFC 894 sending as the default for a dual-format 10Mbps Ethernet Internet host."
    source_ids: [RFC1122, RFC894, RFC1042]
  - claim: "RFC 1812 selects the longest matching installed prefix before metric or vendor policy in its conceptual router lookup."
    source_ids: [RFC1812]
  - claim: "RFC 4632 calls 0.0.0.0/0 the default route, while ARP targets the selected immediate next hop in the Ethernet example."
    source_ids: [RFC4632, RFC826]
